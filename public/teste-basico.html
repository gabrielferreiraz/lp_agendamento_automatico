<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Teste básico</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #070b14;
    color: #f1f5f9;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  button {
    margin-top: 24px;
    padding: 16px 32px;
    font-size: 16px;
    font-weight: 600;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 12px;
  }
  #resultado {
    margin-top: 20px;
    font-size: 14px;
    color: #86efac;
    min-height: 20px;
  }
</style>
</head>
<body>
  <h1>Página de teste — sem React, sem animação</h1>
  <p>Só HTML e JavaScript puro. Toque no botão abaixo.</p>
  <button id="botao" onclick="document.getElementById('resultado').textContent = 'Cliques: ' + (window.__cliques = (window.__cliques||0) + 1); if (window.clarity) clarity('event', 'teste_basico_click');">
    Toque aqui
  </button>
  <div id="resultado"></div>

  <!-- Microsoft Clarity, mesmo projeto — pra dar pra comparar no mesmo lugar -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "y3tnypa3fs");
  </script>
</body>
</html>
